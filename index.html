<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>모델 확인</title>
<style>
:root{color-scheme:dark;--paper:#232936;--panel:#323d50;--stage:#151c27;--ink:#f3f1e9;--muted:#b9c5d8;--select:#f0d58d}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.35 "Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif}
main{max-width:1440px;margin:auto;padding:8px clamp(8px,2vw,24px);height:100vh;height:100dvh;min-height:250px;display:grid;grid-template-rows:auto auto auto minmax(0,1fr);gap:6px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
h1{margin:0;font-size:clamp(16px,2.8vw,23px);letter-spacing:-.04em}
time{color:var(--muted);font-size:11px;white-space:nowrap}
nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
button,select{min-height:44px;color:var(--ink);background:var(--panel);border:1px solid transparent;border-radius:5px;font:inherit}
button{cursor:pointer;padding:0 4px}
button[aria-pressed=true]{background:var(--select);color:var(--stage);font-weight:700}
button:disabled{opacity:.42;cursor:default}
:focus-visible{outline:2px solid var(--select);outline-offset:2px}
.pick{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:10px}
.pick label{font-size:13px;color:var(--muted)}
select{width:100%;padding:0 8px}
.viewer{display:grid;grid-template-rows:minmax(0,1fr) auto;margin:0;min-height:0;gap:6px}
.stage{background:var(--stage);border-radius:4px;display:grid;place-items:center;min-height:0;overflow:hidden;touch-action:pan-y}
img{display:block;width:100%;height:100%;min-height:0;object-fit:contain}
[hidden]{display:none}
.controls{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px;align-items:center;text-align:center}
.controls button{font-size:22px}
#caption-wrap{font-size:clamp(12px,3.6vw,16px);overflow-wrap:anywhere}
#position{display:block;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
</style></head><body>
<main>
<header><h1>모델 확인</h1><time title="사진 갱신 시각 (한국)">갱신 2026-11-12 03:37</time></header>
<nav aria-label="범주"></nav>
<div class="pick"><label for="item">항목</label><select id="item"></select></div>
<div class="viewer" role="group" aria-label="모델 사진">
<div class="stage"><img id="photo" alt="" hidden><span id="message" hidden>표시할 사진이 없습니다.</span></div>
<div class="controls">
<button id="prev" type="button" aria-label="이전 사진" aria-controls="photo">‹</button>
<div id="caption-wrap" aria-live="polite" aria-atomic="true"><span id="caption"></span><span id="position"></span></div>
<button id="next" type="button" aria-label="다음 사진" aria-controls="photo">›</button>
</div>
</div>
</main>

<script>
let groups = JSON.parse(document.querySelector('#catalog').textContent);
let revision = 'be239c5c6c86123467b08614b0d975eceea4d0bc298d46b515583876c82cc942';
let polling = false;
const item = document.querySelector('#item');
const photo = document.querySelector('#photo');
const message = document.querySelector('#message');
const caption = document.querySelector('#caption');
const position = document.querySelector('#position');
const prev = document.querySelector('#prev');
const next = document.querySelector('#next');
let groupIndex = 0;
let photoIndex = 0;
const selections = groups.map(() => 0);
const buttons = groups.map((group, index) => {
  const button = document.createElement('button');
  button.type = 'button';
  button.textContent = group.name;
  button.setAttribute('aria-controls', 'item');
  button.addEventListener('click', () => selectGroup(index));
  document.querySelector('nav').append(button);
  return button;
});
const photos = () => groups[groupIndex].items[item.selectedIndex].photos;

function render() {
  const current = photos()[photoIndex];
  photo.hidden = !current;
  message.hidden = Boolean(current);
  message.textContent = groups[groupIndex].items[item.selectedIndex].message || "표시할 사진이 없습니다.";
  if (current) {
    photo.alt = current.label;
    photo.src = current.src;
  } else {
    photo.removeAttribute('src');
    photo.alt = '';
  }
  caption.textContent = current?.label ?? groups[groupIndex].items[item.selectedIndex].name;
  position.textContent = current ? (photoIndex + 1) + ' / ' + photos().length : '';
  prev.disabled = next.disabled = photos().length < 2;
}
function selectGroup(index) {
  groupIndex = index;
  buttons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === index)));
  item.replaceChildren(...groups[index].items.map(entry => new Option(entry.name)));
  item.selectedIndex = selections[index];
  photoIndex = 0;
  render();
}
function step(delta) {
  const total = photos().length;
  if (total < 2) return;
  photoIndex = (photoIndex + delta + total) % total;
  render();
}
item.addEventListener('change', () => {
  selections[groupIndex] = item.selectedIndex;
  photoIndex = 0;
  render();
});
prev.addEventListener('click', () => step(-1));
next.addEventListener('click', () => step(1));
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.shiftKey ||
      event.target === item || photos().length < 2) return;
  if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
    event.preventDefault();
    step(event.key === 'ArrowLeft' ? -1 : 1);
  }
});
const stage = document.querySelector('.stage');
let start;
stage.addEventListener('pointerdown', event => {
  if (event.isPrimary && event.pointerType === 'touch') {
    start = [event.clientX, event.clientY];
    stage.setPointerCapture(event.pointerId);
  }
});
stage.addEventListener('pointercancel', () => { start = null; });
stage.addEventListener('pointerup', event => {
  if (!event.isPrimary || !start) return;
  const dx = event.clientX - start[0];
  const dy = event.clientY - start[1];
  start = null;
  if (Math.abs(dx) >= 36 && Math.abs(dx) > Math.abs(dy)) step(dx < 0 ? 1 : -1);
});
selectGroup(0);
async function refreshCatalog() {
  if (polling) return;
  polling = true;
  try {
    const fresh = async url => {
      const response = await fetch(url + '?check=' + Date.now(), {cache:'no-store', signal:AbortSignal.timeout(15000)});
      if (!response.ok) throw Error('HTTP ' + response.status);
      return response.json();
    };
    const manifest = await fresh('manifest.json');
    if (manifest.revision === revision) return;
    if (!/^[a-f0-9]{64}$/.test(manifest.revision) || !/^catalog\.[a-f0-9]{20}\.json$/.test(manifest.catalog)) throw Error('Invalid manifest');
    const data = await fresh(manifest.catalog);
    if (!Array.isArray(data.groups) || data.groups.length !== groups.length || data.groups.some((g, i) => g.name !== groups[i].name || !g.items?.length || g.items.some(e => !Array.isArray(e.photos)))) throw Error('Invalid catalog');
    // Download the complete revision before changing controls; failed updates keep the old photo.
    await Promise.race([new Promise((_, reject) => setTimeout(() => reject(Error('Image timeout')),15000)), Promise.all(data.groups.flatMap(g => g.items.flatMap(e => e.photos)).map(p => {
      const preload = new Image(); preload.src = p.src; return preload.decode();
    }))]);
    const selected = groups.map((g,i) => g.items[selections[i]]);
    const view = photos()[photoIndex]?.view;
    const index = photoIndex;
    groups = data.groups;
    groups.forEach((g,i) => { selections[i] = Math.max(0, g.items.findIndex(e =>
      (e.id && e.id === selected[i]?.id) || e.name === selected[i]?.name ||
      e.aliases?.includes(selected[i]?.name))); });
    selectGroup(groupIndex);
    const match = photos().findIndex(p => p.view === view);
    photoIndex = match >= 0 ? match : Math.min(index, Math.max(0, photos().length - 1));
    render();
    document.querySelector('time').textContent = '갱신 ' + data.updated;
    revision = manifest.revision;
  } catch (error) { console.warn('사진 갱신 재시도 예정', error); }
  finally { polling = false; }
}
setInterval(refreshCatalog, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshCatalog(); });
window.addEventListener('online', refreshCatalog);
refreshCatalog();
</script></body></html>
